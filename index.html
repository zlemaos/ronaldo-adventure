<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>호날두의 모험</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="logo" id="btn-home" title="처음 화면">
      <span class="logo-ball">⚽</span><span>호날두의 모험</span>
    </button>
    <div class="top-actions">
      <span class="seed-chip" id="seed-chip" hidden></span>
      <button class="icon-btn" id="btn-mute" title="소리 켜기/끄기" aria-label="소리">🔊</button>
      <button class="icon-btn" id="btn-menu" title="메뉴" aria-label="메뉴">☰</button>
    </div>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<div id="modal-root"></div>
<div id="fx-root"></div>
<div id="toast-root"></div>
<noscript>이 게임은 자바스크립트가 필요합니다.</noscript>

<!-- data packs (classic scripts: works from file://) -->
<script src="data/constants.js"></script>
<script src="data/countries.js"></script>
<script src="data/careers.js"></script>
<script src="data/achievements.js"></script>
<script src="data/events_football.js"></script>
<script src="data/events_life.js"></script>
<script src="data/events_country.js"></script>
<script src="data/events_career.js"></script>
<!-- engine (pure logic; also loaded by Node tests) -->
<script src="js/rng.js"></script>
<script src="js/text.js"></script>
<script src="js/engine.js"></script>
<script src="js/systems.js"></script>
<script src="js/football.js"></script>
<script src="js/activities.js"></script>
<script src="js/save.js"></script>
<!-- presentation -->
<script src="js/pixel.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
