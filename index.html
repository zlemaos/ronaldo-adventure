<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- the web app manifest is added by js/ui.js only when served over http(s); file:// cannot load it -->
<title>인생게임</title>

<body>
<div id="app">
  <header class="topbar">
    <button class="logo" id="btn-home" title="처음 화면">
      <span class="logo-ball">⚽</span><span id="game-name">인생게임</span>
    </button>
    <div class="top-actions">
      <span class="seed-chip" id="seed-chip" hidden></span>
      <button class="icon-btn" id="btn-mute" title="소리 켜기/끄기" aria-label="소리">🔊</button>
      <button class="icon-btn" id="btn-menu" title="메뉴" aria-label="메뉴">☰</button>
    </div>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<div id="modal-root"></div>
<div id="fx-root"></div>
<div id="toast-root"></div>
<noscript>이 게임은 자바스크립트가 필요합니다.</noscript>
